  filter:brightness(.5);
}

  position:absolute;
  font-size:32px;
  font-weight:900;
  letter-spacing:8px;
  animation:pulse 1.5s infinite alternate;

}

@keyframes pulse{

}

/* ===== SUPER CATALOGO (WOW) ===== */
.card-catalog{
  grid-column:1/-1;
  height:210px;
  border-radius:34px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(135deg,var(--green),var(--white),var(--red));
  animation:glow 3s linear infinite alternate;
  transition:.3s;
}

@keyframes glow{
  from{box-shadow:0 0 25px var(--green)}
  to{box-shadow:0 0 45px var(--red)}
}

.card-catalog::before{
  content:"";
  position:absolute;
  inset:4px;
  border-radius:30px;
  background:
    linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.85)),
    url("https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg")
    center/cover no-repeat;
}

.card-catalog span{
  position:relative;
  font-size:32px;
  font-weight:900;
  letter-spacing:10px;
  color:#fff;
  text-shadow:
    0 0 10px var(--green),
    0 0 20px var(--red);
}

.card-catalog:active{
  transform:scale(.97);
}

/* ===== BOTTONI SECONDARI ===== */
.small-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

.card-small{
  width:100%;
  height:120px;
  border-radius:24px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
  box-shadow:0 8px 20px rgba(0,0,0,.6);
}

.card-small img{
  width:85%;
  height:85%;
  object-fit:contain;
  border-radius:16px;
}

.card-small:active{
  transform:scale(.95);
}

.small-label{
  font-size:11px;
  font-weight:900;
  letter-spacing:1.6px;
  background:linear-gradient(90deg,var(--green),var(--white),var(--red));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ===== POPUP PREMIUM ===== */
.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.popup-overlay.show{
  opacity:1;
  pointer-events:auto;
}

.popup-box{
  min-width:260px;
  padding:24px;
  border-radius:24px;
  background:#0a0a0a;
  box-shadow:
    0 0 20px var(--green),
    0 0 30px var(--red);
  text-align:center;
  animation:popupIn .3s ease;
}

@keyframes popupIn{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}

.popup-title{
  font-size:16px;
  font-weight:900;
  margin-bottom:14px;
}

.popup-link{
  display:block;
  padding:12px;
  margin-top:10px;
  font-weight:800;
  color:var(--green);
  text-decoration:none;
  border-radius:12px;
  background:rgba(255,255,255,.05);
}

/* ===== BOTTOM BAR FLOATING ===== */
.bottom-bar{
  position:fixed;
  bottom:16px;
  left:16px;
  right:16px;
  height:70px;
  border-radius:30px;

  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:
    0 10px 30px rgba(0,0,0,.8),
    0 0 20px rgba(0,255,136,.3);
}

.bottom-bar svg{
  width:24px;
  height:24px;
}

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
  },4000);
});

const logoVideo = document.getElementById("logoVideo");
const logoStatic = document.getElementById("logoStatic");
logoVideo.addEventListener("ended",()=>{
  logoVideo.style.display="none";
  logoStatic.style.display="block";
});

const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popup-title");
const popupTelegram = document.getElementById("popup-link-telegram");
const popupSignal = document.getElementById("popup-link-signal");

function openPopup(title, tgText, tgUrl, signalText, signalUrl){
  popupTitle.innerText = title;

  popupTelegram.innerText = tgText;
  popupTelegram.onclick = ()=>tg.openLink(tgUrl);
  popupTelegram.style.display = "block";

  if(signalText && signalUrl){
    popupSignal.innerText = signalText;
    popupSignal.onclick = ()=>tg.openLink(signalUrl);
    popupSignal.style.display = "block";
  } else {
    popupSignal.style.display = "none";
  }

  popup.classList.add("show");
}

function closePopup(){
  popup.classList.remove("show");
}
</script>
