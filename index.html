<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ITALIAN FARM</title>

<script src="https://telegram.org/js/telegram-web-app.js?v=6"></script>

<style>
:root{
  --green:#00ff88;
  --white:#ffffff;
  --red:#ff2a2a;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--white);
  background:#050505;
}

/* ===== LOADER ===== */

#loader{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}

#loader video{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(1.1) contrast(1.1);
}

#loader::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle,transparent 40%,rgba(0,0,0,.7) 100%);
}

#loader-text{
  position:absolute;
  bottom:14%;
  font-size:28px;
  font-weight:900;
  letter-spacing:6px;
  background:linear-gradient(90deg,var(--green),var(--white),var(--red));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:pulse 2.5s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{opacity:.7;transform:scale(1);}
  50%{opacity:1;transform:scale(1.05);}
}

/* ===== BACKGROUND ===== */

.app-bg{
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.95)),
    url("https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg")
    center/cover no-repeat;
}

/* ===== LAYOUT ===== */

.container{
  padding:30px 18px 130px;
  display:flex;
  flex-direction:column;
  gap:28px;
  align-items:center;
}

/* ===== HEADER ===== */

.header{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}

.header video,
.header img{
  width:170px;
  height:170px;
  border-radius:18px;
  object-fit:cover;
  background:#000;

  box-shadow:
    0 15px 40px rgba(0,0,0,.8),
    0 0 25px rgba(0,255,136,.25);
}

.header span{
  font-size:15px;
  font-weight:800;
  letter-spacing:3px;
  opacity:.85;
}

/* ===== PANEL ===== */

.panel{
  width:100%;
  max-width:420px;
  padding:26px;
  border-radius:30px;

  background:#0b0b0b;

  box-shadow:
    0 20px 50px rgba(0,0,0,.9),
    inset 0 0 0 1px rgba(255,255,255,.04);
}

/* ===== GRID ===== */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

/* ===== CATALOGO ===== */

.card-catalog{
  grid-column:1/-1;
  height:180px;
  border-radius:30px;
  cursor:pointer;

  background:
    linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.75)),
    url("https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg")
    center/cover no-repeat;

  box-shadow:
    0 20px 45px rgba(0,0,0,.8),
    0 0 30px rgba(0,255,136,.15);

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.25s ease;
}

.card-catalog:active{
  transform:scale(.97);
}

.card-catalog span{
  font-size:26px;
  font-weight:900;
  letter-spacing:6px;
  color:#fff;

  text-shadow:
    0 0 8px rgba(0,255,136,.6),
    0 0 16px rgba(255,255,255,.3),
    0 0 22px rgba(255,42,42,.5);
}

/* ===== CARD PICCOLE ===== */

.small-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

.card-small{
  width:100%;
  height:120px;
  border-radius:22px;
  background:#111;

  box-shadow:
    0 12px 30px rgba(0,0,0,.8);

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.2s ease;
}

.card-small:active{
  transform:scale(.96);
}

.card-small img{
  width:85%;
  height:85%;
  object-fit:contain;
  border-radius:16px;
}

.small-label{
  font-size:11px;
  font-weight:800;
  letter-spacing:1.5px;
  opacity:.8;
}

/* ===== POPUP ===== */

.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.popup-overlay.show{
  opacity:1;
  pointer-events:auto;
}

.popup-box{
  min-width:240px;
  padding:24px;
  border-radius:20px;
  background:#0d0d0d;

  box-shadow:
    0 20px 50px rgba(0,0,0,.9),
    0 0 25px rgba(0,255,136,.2);

  text-align:center;
}

.popup-title{
  font-size:14px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:14px;
}

.popup-link{
  display:block;
  padding:12px 0;
  font-size:14px;
  font-weight:700;
  color:var(--green);
  text-decoration:none;
  border-top:1px solid rgba(255,255,255,.05);
}

/* ===== BOTTOM BAR ===== */

.bottom-bar{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  height:60px;

  background:#0f0f0f;
  border-radius:40px;

  display:flex;
  justify-content:space-around;
  align-items:center;

  box-shadow:
    0 15px 40px rgba(0,0,0,.9),
    0 0 20px rgba(0,255,136,.1);
}

.bottom-bar svg{
  width:22px;
  height:22px;
}

.bottom-bar a:nth-child(1) svg{fill:var(--red)}
.bottom-bar a:nth-child(2) svg{stroke:var(--white)}
.bottom-bar a:nth-child(3) svg{fill:var(--green)}
</style>
</head>

<body>

<div id="loader">
  <video autoplay muted playsinline>
    <source src="https://res.cloudinary.com/dizbl4jib/video/upload/v1771246950/IMG_4055_1_grhlla.mp4" type="video/mp4">
  </video>
  <div id="loader-text">ITALIAN FARM</div>
</div>

<div class="app-bg"></div>

<div class="container">

  <div class="header">
    <video id="logoVideo" autoplay muted playsinline>
      <source src="https://res.cloudinary.com/dizbl4jib/video/upload/v1771246950/IMG_4055_1_grhlla.mp4" type="video/mp4">
    </video>
    <img id="logoStatic" src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg" style="display:none">
    <span>CATALOGO ITALIAN FARM</span>
  </div>

  <!-- CORNICE GENERALE BOTTONI -->
  <div class="panel">
    <div class="grid">

      <div class="card-catalog" onclick="location.href='catalog.html'">
        <span>CATALOGO</span>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CONTACT',
             '📨 Telegram: @Italianfarm1',
             'https://t.me/Italianfarm1',
             '📞 Signal',
             'https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5',
             '🥔 POTATO',
             'https://tutuduanyu.org/italianfarm'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
        </div>
        <div class="small-label">CONTACTS</div>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CHANNEL',
             '📢 Telegram: ITALIAN FARM ',
             'https://t.me/+TIzcbA_vAMw4ZjU0',
             '📞 Signal',
             'https://signal.group/#CjQKIDNGRGl9UmFJzST3ADxn0PsPIc0zsRWW1foOy3Ity-KvEhBjRjUNbHUuV1qczApKp_ok'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
        </div>
        <div class="small-label">CHANNELS</div>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CREATED BY',
             '👨‍💻 BOX CREATE',
             'https://t.me/boxcreate22'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
        </div>
        <div class="small-label">CREATED BY</div>
      </div>

      <div class="small-wrapper" onclick="location.href='recensioni.html'">

  <div class="card-small">
    <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
  </div>

  <div class="small-label">RECENSIONI</div>

</div>

    </div>
  </div>
</div>

<!-- POPUP -->
<div id="popup" class="popup-overlay" onclick="closePopup()">
  <div class="popup-box" onclick="event.stopPropagation()">
    <div class="popup-title" id="popup-title"></div>
    <a class="popup-link" id="popup-link-telegram" href="#"></a>
    <a class="popup-link" id="popup-link-signal" href="#" style="display:none;"></a>
  </div>
</div>

<div class="bottom-bar">
  <a onclick="tg.openLink('https://t.me/Italianfarm1')">
    <svg viewBox="0 0 24 24"><path d="M22.5 3.5L2.8 10.9c-.9.3-.9 1.6.1 1.9l4.9 1.6 1.9 5.9c.3.9 1.5 1 2 .2l2.8-4.1 5.6 4.1c.8.6 2 .1 2.2-.9l3.4-15.3c.2-.9-.7-1.6-1.7-1.4z"/></svg>
  </a>
  <a onclick="tg.openLink('https://instagram.com/INSERT_LINK')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" ry="5" fill="none" stroke-width="2"/>
    <circle cx="12" cy="12" r="4" fill="none" stroke-width="2"/>
    <circle cx="17.5" cy="6.5" r="1.2"/></svg>
  </a>
  <a onclick="tg.openLink('https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5')">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20"/></svg>
  </a>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
  },4000);
});

const logoVideo = document.getElementById("logoVideo");
const logoStatic = document.getElementById("logoStatic");
logoVideo.addEventListener("ended",()=>{
  logoVideo.style.display="none";
  logoStatic.style.display="block";
});

const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popup-title");
const popupTelegram = document.getElementById("popup-link-telegram");
const popupSignal = document.getElementById("popup-link-signal");

function openPopup(title, tgText, tgUrl, signalText, signalUrl){
  popupTitle.innerText = title;

  popupTelegram.innerText = tgText;
  popupTelegram.onclick = ()=>tg.openLink(tgUrl);
  popupTelegram.style.display = "block";

  if(signalText && signalUrl){
    popupSignal.innerText = signalText;
    popupSignal.onclick = ()=>tg.openLink(signalUrl);
    popupSignal.style.display = "block";
  } else {
    popupSignal.style.display = "none";
  }

  popup.classList.add("show");
}

function closePopup(){
  popup.classList.remove("show");
}
</script>

</body>
</html>
