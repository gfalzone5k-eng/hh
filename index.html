<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ITALIAN FARM</title>

<script src="https://telegram.org/js/telegram-web-app.js?v=6"></script>

<style>
:root{
  --gold:#FFD700;
  --gold-dark:#b8860b;
  --black:#000000;
  --black-deep:#050505;
}

/* RESET */
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--gold);
  background:radial-gradient(circle at top,#111 0%,#000 60%);
}

/* ===== LOADER ===== */
#loader{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}
#loader video{
  width:100%;
  height:100%;
  object-fit:contain;
}
#loader::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.85);
}
#loader-text{
  position:absolute;
  bottom:14%;
  font-size:32px;
  font-weight:900;
  letter-spacing:8px;
  color:var(--gold);
  text-shadow:
    0 0 10px var(--gold),
    0 0 25px var(--gold),
    0 0 45px #ffae00;
}

/* ===== BACKGROUND APP ===== */
.app-bg{
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    linear-gradient(rgba(0,0,0,.88),rgba(0,0,0,.95)),
    url("https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg")
    center/cover no-repeat;
  filter:brightness(.6);
}

/* ===== LAYOUT ===== */
.container{
  padding:28px 16px 130px;
  display:flex;
  flex-direction:column;
  gap:30px;
  align-items:center;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}

.header video,.header img{
  width:160px;
  height:160px;
  border-radius:20px;
  border:2px solid var(--gold);
  box-shadow:
    0 0 15px var(--gold),
    0 0 35px var(--gold-dark);
  object-fit:cover;
  background:#000;
}

.header span{
  font-size:18px;
  font-weight:900;
  letter-spacing:3px;
  color:var(--gold);
  text-shadow:0 0 12px var(--gold);
}

/* ===== PANEL ===== */
.panel{
  width:100%;
  max-width:420px;
  background:rgba(0,0,0,.95);
  border-radius:30px;
  padding:26px;
  border:2px solid var(--gold);
  box-shadow:
    0 0 15px var(--gold),
    inset 0 0 25px rgba(255,215,0,.15);
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

/* ===== CATALOGO ===== */
.card-catalog{
  grid-column:1/-1;
  height:190px;
  border-radius:30px;
  cursor:pointer;
  background:
    linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.85)),
    url("https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg")
    center/cover no-repeat;
  border:2px solid var(--gold);
  box-shadow:
    0 0 20px var(--gold),
    0 0 45px rgba(255,215,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.3s;
}

.card-catalog:hover{
  transform:scale(1.03);
  box-shadow:
    0 0 25px var(--gold),
    0 0 60px #ffae00;
}

.card-catalog span{
  font-size:30px;
  font-weight:900;
  letter-spacing:8px;
  color:var(--gold);
  text-shadow:
    0 0 10px var(--gold),
    0 0 25px #ffae00;
}

/* ===== BOTTONI PICCOLI ===== */
.small-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.card-small{
  width:100%;
  height:120px;
  border-radius:22px;
  background:#000;
  border:2px solid var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 0 15px var(--gold);
  transition:.3s;
}

.card-small:hover{
  transform:translateY(-4px);
  box-shadow:
    0 0 20px var(--gold),
    0 0 40px #ffae00;
}

.card-small img{
  width:85%;
  height:85%;
  object-fit:contain;
  border-radius:16px;
}

.small-label{
  padding:6px 16px;
  border-radius:14px;
  font-size:12px;
  font-weight:900;
  letter-spacing:2px;
  background:var(--gold);
  color:#000;
  box-shadow:0 0 15px var(--gold);
}

/* ===== POPUP ===== */
.popup-box{
  min-width:240px;
  padding:22px 26px;
  border-radius:18px;
  background:#000;
  border:2px solid var(--gold);
  box-shadow:
    0 0 20px var(--gold);
  text-align:center;
}

.popup-title{
  font-size:16px;
  font-weight:900;
  letter-spacing:3px;
  margin-bottom:12px;
  color:var(--gold);
}

.popup-link{
  display:block;
  padding-top:10px;
  margin-top:10px;
  font-size:14px;
  font-weight:800;
  letter-spacing:1px;
  color:var(--gold);
  text-decoration:none;
}

/* ===== BOTTOM BAR ===== */
.bottom-bar{
  position:fixed;
  bottom:14px;
  left:14px;
  right:14px;
  height:70px;
  background:#000;
  border-radius:30px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border:2px solid var(--gold);
  box-shadow:
    0 0 20px var(--gold);
}

.bottom-bar svg{
  width:24px;
  height:24px;
  fill:var(--gold);
  stroke:var(--gold);
}
</style>
</head>

<body>

<div id="loader">
  <video autoplay muted playsinline>
    <source src="https://res.cloudinary.com/dizbl4jib/video/upload/v1771246950/IMG_4055_1_grhlla.mp4" type="video/mp4">
  </video>
  <div id="loader-text">ITALIAN FARM</div>
</div>

<div class="app-bg"></div>

<div class="container">

  <div class="header">
    <video id="logoVideo" autoplay muted playsinline>
      <source src="https://res.cloudinary.com/dizbl4jib/video/upload/v1771246950/IMG_4055_1_grhlla.mp4" type="video/mp4">
    </video>
    <img id="logoStatic" src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg" style="display:none">
    <span>CATALOGO ITALIAN FARM</span>
  </div>

  <!-- CORNICE GENERALE BOTTONI -->
  <div class="panel">
    <div class="grid">

      <div class="card-catalog" onclick="location.href='catalog.html'">
        <span>CATALOGO</span>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CONTACT',
             '📨 Telegram: @Italianfarm1',
             'https://t.me/Italianfarm1',
             '📞 Signal',
             'https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5',
             '🥔 POTATO',
             'https://tutuduanyu.org/italianfarm'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
        </div>
        <div class="small-label">CONTACTS</div>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CHANNEL',
             '📢 Telegram: GASCLOUDPRIVE',
             'https://t.me/+TIzcbA_vAMw4ZjU0',
             '📞 Signal',
             'https://signal.group/#CjQKIDNGRGl9UmFJzST3ADxn0PsPIc0zsRWW1foOy3Ity-KvEhBjRjUNbHUuV1qczApKp_ok'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
        </div>
        <div class="small-label">CHANNELS</div>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CREATED BY',
             '👨‍💻 BOX CREATE',
             'https://t.me/boxcreate22'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
        </div>
        <div class="small-label">CREATED BY</div>
      </div>

      <div class="small-wrapper">
        <div class="card-small">
          <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
        </div>
        <div class="small-label">NEWS</div>
      </div>

    </div>
  </div>
</div>

<!-- POPUP -->
<div id="popup" class="popup-overlay" onclick="closePopup()">
  <div class="popup-box" onclick="event.stopPropagation()">
    <div class="popup-title" id="popup-title"></div>
    <a class="popup-link" id="popup-link-telegram" href="#"></a>
    <a class="popup-link" id="popup-link-signal" href="#" style="display:none;"></a>
  </div>
</div>

<div class="bottom-bar">
  <a onclick="tg.openLink('https://t.me/Italianfarm1')">
    <svg viewBox="0 0 24 24"><path d="M22.5 3.5L2.8 10.9c-.9.3-.9 1.6.1 1.9l4.9 1.6 1.9 5.9c.3.9 1.5 1 2 .2l2.8-4.1 5.6 4.1c.8.6 2 .1 2.2-.9l3.4-15.3c.2-.9-.7-1.6-1.7-1.4z"/></svg>
  </a>
  <a onclick="tg.openLink('https://instagram.com/INSERT_LINK')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" ry="5" fill="none" stroke-width="2"/>
    <circle cx="12" cy="12" r="4" fill="none" stroke-width="2"/>
    <circle cx="17.5" cy="6.5" r="1.2"/></svg>
  </a>
  <a onclick="tg.openLink('https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5')">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20"/></svg>
  </a>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
  },4000);
});

const logoVideo = document.getElementById("logoVideo");
const logoStatic = document.getElementById("logoStatic");
logoVideo.addEventListener("ended",()=>{
  logoVideo.style.display="none";
  logoStatic.style.display="block";
});

const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popup-title");
const popupTelegram = document.getElementById("popup-link-telegram");
const popupSignal = document.getElementById("popup-link-signal");

function openPopup(title, tgText, tgUrl, signalText, signalUrl){
  popupTitle.innerText = title;

  popupTelegram.innerText = tgText;
  popupTelegram.onclick = ()=>tg.openLink(tgUrl);
  popupTelegram.style.display = "block";

  if(signalText && signalUrl){
    popupSignal.innerText = signalText;
    popupSignal.onclick = ()=>tg.openLink(signalUrl);
    popupSignal.style.display = "block";
  } else {
    popupSignal.style.display = "none";
  }

  popup.classList.add("show");
}

function closePopup(){
  popup.classList.remove("show");
}
</script>

</body>
</html>
