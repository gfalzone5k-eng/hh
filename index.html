<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ROMA BLANCA 99</title>

<script src="https://telegram.org/js/telegram-web-app.js?v=6"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap');

:root{
  --blue-dark:#0a1628;
  --blue-deep:#0f223d;
  --gold:#d4af37;
  --gold-light:#f8e7a1;
  --marble:#f5f2ea;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  font-family:"Cinzel", serif;
  background:linear-gradient(rgba(10,22,40,.97),rgba(10,22,40,.99));
  color:var(--gold-light);
  overflow-x:hidden;
}

/* ================= PORTONE LOADER ================= */

#loader{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  overflow:hidden;
}

.door{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
  background:linear-gradient(to right,#3a2a15,#5a3d1f,#3a2a15);
  transition:transform 2.5s ease-in-out;
  z-index:2;
}

.door.left{left:0;}
.door.right{right:0;}

.loader-content{
  position:relative;
  z-index:1;
  text-align:center;
}

.loader-video{
  width:180px;
  height:180px;
  border-radius:50%;
  border:6px double var(--gold);
  object-fit:cover;
  box-shadow:0 0 30px rgba(212,175,55,.8);
}

#loader-text{
  margin-top:20px;
  font-size:26px;
  letter-spacing:6px;
  color:var(--gold);
}

/* ================= COLONNE ================= */

.column{
  position:fixed;
  top:0;
  bottom:0;
  width:60px;
  background:linear-gradient(to right,#cfcac0,#f5f2ea,#cfcac0);
  z-index:-1;
  box-shadow:inset 0 0 20px rgba(212,175,55,.3);
}
.column.left{left:0;}
.column.right{right:0;}

/* ================= HEADER ================= */

.container{
  padding:24px 70px 120px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
}

.logo-video{
  width:150px;
  height:150px;
  border-radius:50%;
  border:6px double var(--gold);
  object-fit:cover;
  box-shadow:0 0 25px rgba(212,175,55,.6);
}

.header span{
  font-size:16px;
  letter-spacing:3px;
}

/* ================= PANEL ================= */

.panel{
  width:100%;
  max-width:420px;
  background:var(--blue-deep);
  border-radius:22px;
  padding:22px;
  border:5px double var(--gold);
  position:relative;
  box-shadow:0 0 25px rgba(212,175,55,.4);
}

.panel::before{
  content:"🦅 SPQR 🦅";
  position:absolute;
  top:-18px;
  left:50%;
  transform:translateX(-50%);
  background:var(--blue-dark);
  padding:4px 16px;
  border:3px solid var(--gold);
  border-radius:10px;
  letter-spacing:3px;
  font-size:12px;
  box-shadow:0 0 15px rgba(212,175,55,.6);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.card-catalog{
  grid-column:1/-1;
  height:160px;
  border-radius:18px;
  cursor:pointer;
  background:
    linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.6)),
    url("https://tgwos.github.io/ROMABLANCA99/foto1.jpg")
    center/cover no-repeat;
  border:4px double var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-catalog span{
  font-size:22px;
  letter-spacing:6px;
}

.small-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  cursor:pointer;
}

.card-small{
  width:100%;
  height:110px;
  border-radius:16px;
  background:var(--marble);
  border:4px double var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
}

.small-label{
  padding:5px 12px;
  border-radius:10px;
  font-size:11px;
  letter-spacing:2px;
  background:var(--gold);
  color:#000;
}

/* ================= POPUP ================= */

.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.popup-overlay.show{display:flex;}

.popup-box{
  min-width:240px;
  padding:20px;
  border-radius:16px;
  background:var(--marble);
  border:4px double var(--gold);
  text-align:center;
  color:#000;
}

/* ================= BOTTOM BAR ================= */

.bottom-bar{
  position:fixed;
  bottom:12px;
  left:70px;
  right:70px;
  height:65px;
  background:var(--blue-deep);
  border-radius:20px;
  border:4px double var(--gold);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.bottom-bar svg{
  width:22px;
  height:22px;
  fill:var(--gold);
  stroke:var(--gold);
}
</style>
</head>

<body>

<div id="loader">
  <div class="door left"></div>
  <div class="door right"></div>

  <div class="loader-content">
    <video class="loader-video" autoplay muted loop playsinline>
      <source src="https://tgwos.github.io/ROMABLANCA99/video1.MP4" type="video/mp4">
    </video>
    <div id="loader-text">ROMA BLANCA 99</div>
  </div>
</div>

<div class="column left"></div>
<div class="column right"></div>

<div class="container">

  <div class="header">
    <video class="logo-video" autoplay muted loop playsinline>
      <source src="https://tgwos.github.io/ROMABLANCA99/video1.MP4" type="video/mp4">
    </video>
    <span>CATALOGO ROMA BLANCA 99</span>
  </div>

  <!-- Qui rimangono tutti i tuoi bottoni e popup identici alla versione precedente -->

</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.querySelector(".door.left").style.transform="translateX(-100%)";
    document.querySelector(".door.right").style.transform="translateX(100%)";
  },300);

  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
  },3000);
});
</script>

</body>
</html>
