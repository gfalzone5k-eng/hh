<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Gas Cloud</title>

<script src="https://telegram.org/js/telegram-web-app.js?v=6"></script>

<style>
:root{

--bg:#050507;
--card:#0f0f12;
--neon:#ff003c;
--neonSoft:#ff003c66;
--text:#ffffff;
--sub:#9a9aa0;

--radius:20px;

}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{

margin:0;

font-family:'Orbitron',sans-serif;

background:radial-gradient(circle at top,#111,#050505);

color:var(--text);

overflow-x:hidden;

}

/* CYBERPUNK BACKGROUND */

body::before{

content:"";

position:fixed;
inset:-50%;

background:

radial-gradient(circle at 20% 30%,rgba(255,0,60,.3),transparent 40%),
radial-gradient(circle at 80% 40%,rgba(255,0,60,.2),transparent 40%),
radial-gradient(circle at 50% 80%,rgba(255,0,60,.15),transparent 50%);

filter:blur(120px);

animation:bgmove 20s linear infinite;

z-index:-1;

}

@keyframes bgmove{

0%{transform:translate(0,0)}
50%{transform:translate(-10%,6%)}
100%{transform:translate(0,0)}

}

/* CONTAINER */

.container{

padding:30px 18px 150px;

max-width:440px;

margin:auto;

display:flex;

flex-direction:column;

align-items:center;

gap:34px;

}

/* LOGO */

.header-logo img{

width:115px;
height:115px;

border-radius:50%;

box-shadow:

0 0 20px var(--neon),
0 0 60px var(--neonSoft);

}

/* SLIDER 3D */

.preview-box{

width:100%;

perspective:1000px;

overflow:hidden;

}

.preview-slider{

display:flex;

gap:20px;

transform-style:preserve-3d;

}

.preview-card{

min-width:160px;
height:170px;

border-radius:18px;

overflow:hidden;

background:var(--card);

border:1px solid rgba(255,255,255,.05);

box-shadow:

0 10px 40px rgba(0,0,0,.8);

transition:.4s;

}

.preview-card:hover{

transform:

rotateY(10deg)
scale(1.06);

box-shadow:

0 0 30px var(--neonSoft);

}

.preview-card img{

width:100%;
height:100%;

object-fit:cover;

}

/* PANEL */

.panel{

width:100%;

padding:20px;

border-radius:var(--radius);

background:rgba(20,20,25,.6);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.05);

box-shadow:

0 20px 60px rgba(0,0,0,.8);

}

/* GRID */

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

}

/* CATALOGO SHOP */

.card-catalog{

grid-column:1/-1;

height:140px;

border-radius:var(--radius);

display:flex;

align-items:center;

gap:20px;

padding:0 22px;

cursor:pointer;

background:

linear-gradient(145deg,#151518,#0a0a0c);

border:1px solid rgba(255,255,255,.06);

box-shadow:

0 0 30px var(--neonSoft);

transition:.25s;

position:relative;

overflow:hidden;

}

.card-catalog::after{

content:"";

position:absolute;

inset:0;

background:

linear-gradient(
120deg,
transparent,
rgba(255,255,255,.15),
transparent
);

transform:translateX(-100%);

transition:1s;

}

.card-catalog:hover::after{

transform:translateX(100%);

}

.card-catalog:active{

transform:scale(.94);

}

.card-catalog img{

width:70px;
height:70px;

border-radius:50%;

}

.card-catalog span{

font-size:24px;

font-weight:700;

}

/* SMALL CARDS */

.card-small{

height:120px;

border-radius:var(--radius);

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

gap:12px;

cursor:pointer;

background:linear-gradient(145deg,#151518,#0a0a0c);

border:1px solid rgba(255,255,255,.05);

box-shadow:

0 10px 30px rgba(0,0,0,.8);

transition:.25s;

position:relative;

overflow:hidden;

}

.card-small:hover{

box-shadow:

0 0 20px var(--neonSoft);

}

.card-small:active{

transform:scale(.9);

}

.card-small img{

width:50px;
height:50px;

border-radius:50%;

}

.card-small span{

font-size:12px;

color:var(--sub);

}

/* POPUP */

.popup-overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.8);

display:flex;

align-items:center;

justify-content:center;

opacity:0;

pointer-events:none;

transition:.25s;

}

.popup-overlay.show{

opacity:1;

pointer-events:auto;

}

.popup-box{

padding:28px;

border-radius:20px;

text-align:center;

background:#0e0e12;

border:1px solid rgba(255,255,255,.06);

box-shadow:

0 0 40px var(--neonSoft);

}

.popup-title{

font-size:18px;

font-weight:700;

margin-bottom:16px;

}

.popup-username{

display:block;

padding:13px;

margin-top:12px;

border-radius:14px;

background:#18181c;

color:white;

text-decoration:none;

transition:.2s;

}

.popup-username:hover{

box-shadow:

0 0 12px var(--neonSoft);

}

/* MENU ANIMATO */

.bottom-bar{

position:fixed;

bottom:18px;

left:18px;

right:18px;

height:70px;

display:flex;

justify-content:space-around;

align-items:center;

border-radius:26px;

background:rgba(10,10,12,.9);

backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,.05);

box-shadow:

0 10px 40px rgba(0,0,0,.9);

}

.bottom-bar a{

display:flex;

flex-direction:column;

align-items:center;

gap:4px;

font-size:12px;

font-weight:600;

color:var(--neon);

text-decoration:none;

position:relative;

transition:.25s;

}

.bottom-bar a::after{

content:"";

position:absolute;

bottom:-6px;

width:0;

height:2px;

background:var(--neon);

transition:.25s;

}

.bottom-bar a:hover::after{

width:100%;

}

.bottom-bar a:active{

transform:scale(.85);

}





</style>
</head>

<body>

<div class="container">

</div>

)">
<img src="https://tgwos.github.io/mini-app1/4985865506745158660.jpg">
<span>CONTACTS</span>
</div>

<div class="card-small"
onclick="openPopup(
'CHANNEL',
'📢 Telegram: GASCLOUDPRIVE',
'https://t.me/+iMgIPdF4HPswMDRh',
'📞 Signal',
'https://signal.group/#CjQKIDujiZdq6QYIPqOVMwE8I2utpG27IFlHr3NcGuX9rg7nEhB5oZDrOOzWhaoX4bTSIZ4W'
)">
<img src="https://tgwos.github.io/mini-app1/4985865506745158660.jpg">
<span>CHANNELS</span>
</div>

<div class="card-small"
onclick="openPopup(
'CREATED BY',

<img src="https://tgwos.github.io/mini-app1/4985865506745158660.jpg">

<img src="https://tgwos.github.io/mini-app1/4985865506745158660.jpg">
<span>NEWS</span>
</div>

</div>
</div>
</div>

<div id="popup" class="popup-overlay" onclick="closePopup()">
<div class="popup-box" onclick="event.stopPropagation()">
<div class="popup-title" id="popup-title"></div>
<a class="popup-username" id="popup-link-telegram"></a>
<a class="popup-username" id="popup-link-signal" style="display:none;"></a>
</div>
</div>

<div class="bottom-bar">

<a onclick="tg.openLink('https://t.me/GasCloud2')">
Telegram

<a onclick="tg.openLink('https://www.instagram.com/gascloud11')">

</a>

</a>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

</script>

<script>

const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popup-title");
const popupTelegram = document.getElementById("popup-link-telegram");
const popupSignal = document.getElementById("popup-link-signal");

function openPopup(title,tgText,tgUrl,signalText,signalUrl){

popupTitle.innerText = title;

popupTelegram.innerText = tgText;
popupTelegram.onclick = ()=>tg.openLink(tgUrl);
popupTelegram.style.display="block";

if(signalText && signalUrl){
popupSignal.innerText = signalText;
popupSignal.onclick = ()=>tg.openLink(signalUrl);
popupSignal.style.display="block";
}else{
popupSignal.style.display="none";
}

popup.classList.add("show");

}

function closePopup(){
popup.classList.remove("show");
}

</script>

<script>

let productsData = [];

async function loadProducts(){

const res = await fetch("products.json");
productsData = await res.json();

const slider = document.getElementById("preview-slider");

productsData.forEach(product => {

const card = document.createElement("div");
card.className = "preview-card";

card.innerHTML = `
<img src="${product.previewImage}">
`;

slider.appendChild(card);

});

duplicateSlider();
startSlider();

}

function duplicateSlider(){

const slider = document.getElementById("preview-slider");

const cards = [...slider.children];

cards.forEach(card=>{
const clone = card.cloneNode(true);
slider.appendChild(clone);
});

}

function startSlider(){

const slider = document.getElementById("preview-slider");

let speed = 0.35;

function animate(){

slider.scrollLeft += speed;

if(slider.scrollLeft >= slider.scrollWidth/2){
slider.scrollLeft = 0;
}

requestAnimationFrame(animate);

}

animate();

}

loadProducts();

</script>
