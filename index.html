<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ROMA BLANCA 93</title>

<script src="https://telegram.org/js/telegram-web-app.js?v=6"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap');

:root{
  --blue-dark:#0a1628;
  --blue-deep:#0f223d;
  --gold:#d4af37;
  --gold-light:#f8e7a1;
  --marble:#f5f2ea;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  font-family:"Cinzel", serif;
  background:linear-gradient(rgba(10,22,40,.97),rgba(10,22,40,.99));
  color:var(--gold-light);
  overflow-x:hidden;
}

/* CONTAINER */
.container{
  padding:24px 16px 120px;
  width:100%;
  max-width:500px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
}

.header{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  text-align:center;
}

.logo-video{
  width:38vw;
  height:38vw;
  max-width:160px;
  max-height:160px;
  border-radius:50%;
  border:6px double var(--gold);
  object-fit:cover;
  box-shadow:0 0 25px rgba(212,175,55,.6);
}

.panel{
  width:100%;
  max-width:420px;
  background:var(--blue-deep);
  border-radius:22px;
  padding:22px;
  border:5px double var(--gold);
  position:relative;
  box-shadow:0 0 25px rgba(212,175,55,.4);
}

.panel::before{
  content:"🦅 SPQR 🦅";
  position:absolute;
  top:-18px;
  left:50%;
  transform:translateX(-50%);
  background:var(--blue-dark);
  padding:4px 16px;
  border:3px solid var(--gold);
  border-radius:10px;
  letter-spacing:3px;
  font-size:12px;
}

/* GRIGLIA 2x2 */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.card-catalog{
  grid-column:1/-1;
  height:160px;
  border-radius:18px;
  cursor:pointer;
  background:
    linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.6)),
    url("https://tgwos.github.io/ROMABLANCA99/foto1.jpg")
    center/cover no-repeat;
  border:4px double var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-catalog span{
  font-size:22px;
  letter-spacing:6px;
}

/* BOTTONI */
.small-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

.card-small{
  width:100%;
  height:120px;
  border-radius:16px;
  background:var(--marble);
  border:4px double var(--gold);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-small img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.small-label{
  padding:6px 14px;
  border-radius:10px;
  font-size:11px;
  letter-spacing:2px;
  background:var(--gold);
  color:#000;
}

/* POPUP */
.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.popup-overlay.show{display:flex;}

.popup-box{
  min-width:240px;
  padding:20px;
  border-radius:16px;
  background:var(--marble);
  border:4px double var(--gold);
  text-align:center;
  color:#000;
}

.popup-title{
  font-size:14px;
  letter-spacing:3px;
}

.popup-link{
  display:block;
  padding-top:8px;
  margin-top:8px;
  font-size:13px;
  text-decoration:none;
  color:#102542;
}

/* BOTTOM BAR */
.bottom-bar{
  position:fixed;
  bottom:12px;
  left:12px;
  right:12px;
  height:65px;
  background:var(--blue-deep);
  border-radius:20px;
  border:4px double var(--gold);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom-bar svg{
  width:22px;
  height:22px;
  fill:var(--gold);
  stroke:var(--gold);
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <video class="logo-video" autoplay muted loop playsinline>
      <source src="https://tgwos.github.io/ROMABLANCA99/video1.MP4" type="video/mp4">
    </video>
    <span>CATALOGO ROMA BLANCA 93</span>
  </div>

  <div class="panel">
    <div class="grid">

      <div class="card-catalog" onclick="location.href='catalog.html'">
        <span>CATALOGO</span>
      </div>

      <div class="small-wrapper"
        onclick="openPopup('CONTACT','📨 Telegram: @Italianfarm1','https://t.me/Italianfarm1','📞 Signal','https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5')">
        <div class="card-small">
          <img src="https://tgwos.github.io/ROMABLANCA99/foto1.jpg">
        </div>
        <div class="small-label">CONTACTS</div>
      </div>

      <div class="small-wrapper"
        onclick="openPopup('CHANNEL','📢 Telegram: GASCLOUDPRIVE','https://t.me/+TIzcbA_vAMw4ZjU0')">
        <div class="card-small">
          <img src="https://tgwos.github.io/ROMABLANCA99/foto1.jpg">
        </div>
        <div class="small-label">CHANNELS</div>
      </div>

      <div class="small-wrapper"
        onclick="openPopup('CREATED BY','👨‍💻 BOX CREATE','https://t.me/boxcreate22')">
        <div class="card-small">
          <img src="https://tgwos.github.io/ROMABLANCA99/foto1.jpg">
        </div>
        <div class="small-label">CREATED BY</div>
      </div>

      <div class="small-wrapper">
        <div class="card-small">
          <img src="https://tgwos.github.io/ROMABLANCA99/foto1.jpg">
        </div>
        <div class="small-label">NEWS</div>
      </div>

    </div>
  </div>
</div>

<!-- POPUP -->
<div id="popup" class="popup-overlay" onclick="closePopup()">
  <div class="popup-box" onclick="event.stopPropagation()">
    <div class="popup-title" id="popup-title"></div>
    <a class="popup-link" id="popup-link-telegram"></a>
    <a class="popup-link" id="popup-link-signal" style="display:none;"></a>
  </div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <a onclick="tg.openLink('https://t.me/Italianfarm1')">
    <svg viewBox="0 0 24 24"><path d="M22.5 3.5L2.8 10.9c-.9.3-.9 1.6.1 1.9l4.9 1.6 1.9 5.9c.3.9 1.5 1 2 .2l2.8-4.1 5.6 4.1c.8.6 2 .1 2.2-.9l3.4-15.3c.2-.9-.7-1.6-1.7-1.4z"/></svg>
  </a>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const popup=document.getElementById("popup");
const popupTitle=document.getElementById("popup-title");
const popupTelegram=document.getElementById("popup-link-telegram");
const popupSignal=document.getElementById("popup-link-signal");

function openPopup(title,tgText,tgUrl,signalText,signalUrl){
  popupTitle.innerText=title;
  popupTelegram.innerText=tgText;
  popupTelegram.onclick=()=>tg.openLink(tgUrl);
  popupTelegram.style.display="block";

  if(signalText && signalUrl){
    popupSignal.innerText=signalText;
    popupSignal.onclick=()=>tg.openLink(signalUrl);
    popupSignal.style.display="block";
  } else {
    popupSignal.style.display="none";
  }

  popup.classList.add("show");
}

function closePopup(){
  popup.classList.remove("show");
}
</script>

</body>
</html>
