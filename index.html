<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Ordini</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1e40af;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: linear-gradient(90deg, #1e293b, #0f172a);
      color: white;
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .header-title {
      font-size: 22px;
      font-weight: 600;
    }

    .admin-btn {
      background: white;
      color: #0f172a;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      transition: 0.2s;
      white-space: nowrap;
    }

    .admin-btn:hover {
      background: #e2e8f0;
    }

    .container {
      display: flex;
      gap: 20px;
      padding: 20px;
      align-items: flex-start;
    }

    .products {
      flex: 3;
    }

    input[type="text"],
    input[type="password"],
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-family: 'Inter', sans-serif;
    }

    .product-card {
      background: var(--card);
      padding: 18px;
      border-radius: var(--radius);
      margin-bottom: 15px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    }

    .product-card strong {
      display: block;
      margin-bottom: 4px;
    }

    .product-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }

    .product-actions input {
      max-width: 100px;
      margin-bottom: 0;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    .cart {
      flex: 1;
      background: white;
      border-radius: var(--radius);
      padding: 15px;
      border: 1px solid var(--border);
      position: sticky;
      top: 20px;
      height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      min-width: 320px;
    }

    .cart-content {
      overflow-y: auto;
      flex: 1;
    }

    .cart-footer {
      position: sticky;
      bottom: 0;
      background: white;
      padding-top: 10px;
    }

    #inviaOrdine {
      width: 100%;
      padding: 12px;
      font-size: 16px;
    }

    textarea {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-family: 'Inter', sans-serif;
      resize: none;
      overflow: hidden;
      min-height: 44px;
    }

    textarea:focus,
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item button {
      padding: 6px 10px;
      font-size: 12px;
    }

    .empty-state {
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }

      .cart {
        position: relative;
        height: auto;
        width: 100%;
        min-width: unset;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-title">Gestione Ordini</div>
    <a href="./admin.html" class="admin-btn">Accesso Admin</a>
  </header>

  <div class="container">

    <div class="products">
      <input type="text" id="search" placeholder="🔍 Cerca per codice o descrizione">
      <div id="prodotti"></div>
    </div>

    <div class="cart">
      <div class="cart-content">
        <h3>🛒 Carrello</h3>

        <h4>Sede *</h4>
        <input type="text" id="sede" placeholder="Inserisci la sede" required>

        <h4>Password *</h4>
        <input type="password" id="password" placeholder="Inserisci password" required>

        <h4>Descrizione (opzionale)</h4>
        <textarea id="descrizioneOrdine" placeholder="Note aggiuntive (facoltative)" rows="2"></textarea>

        <div id="carrello"></div>
      </div>

      <div class="cart-footer">
        <button id="inviaOrdine" disabled>Invia Ordine</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function () {
      emailjs.init("V2AqVZ5Nr5ox99bsY");
    })();
  </script>

  <script type="module" src="./app.js"></script>
</body>
</html>
