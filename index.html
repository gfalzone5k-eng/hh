<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ROMA BLANCA 99</title>

<script src="https://telegram.org/js/telegram-web-app.js?v=6"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');

:root{
  --blue-dark:#0a1628;
  --blue-deep:#0f223d;
  --gold:#d4af37;
  --gold-light:#f8e7a1;
  --marble:#f5f2ea;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  font-family:"Cinzel", serif;
  color:var(--gold-light);
  background:linear-gradient(rgba(10,22,40,.96),rgba(10,22,40,.98));
  overflow-x:hidden;
}

/* COLONNE ROMANE */
.column{
  position:fixed;
  top:0;
  bottom:0;
  width:60px;
  background:
    linear-gradient(to right,#cfcac0,#f5f2ea,#cfcac0);
  z-index:-1;
  box-shadow:inset 0 0 15px rgba(0,0,0,.4);
  animation:columnGlow 4s ease-in-out infinite alternate;
}

.column.left{left:0;}
.column.right{right:0;}

@keyframes columnGlow{
  from{box-shadow:inset 0 0 15px rgba(0,0,0,.5);}
  to{box-shadow:inset 0 0 25px rgba(212,175,55,.6);}
}

/* LOADER */
#loader{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--blue-dark);
}

#loader-text{
  position:absolute;
  bottom:14%;
  font-size:28px;
  letter-spacing:6px;
  color:var(--gold);
  animation:goldPulse 2s infinite alternate;
}

@keyframes goldPulse{
  from{text-shadow:0 0 5px rgba(212,175,55,.5);}
  to{text-shadow:0 0 20px rgba(212,175,55,1);}
}

/* LAYOUT */
.container{
  padding:24px 70px 120px;
  display:flex;
  flex-direction:column;
  gap:22px;
  align-items:center;
}

/* HEADER */
.header{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  text-align:center;
}

.header img{
  width:140px;
  height:140px;
  border-radius:50%;
  border:6px double var(--gold);
  object-fit:cover;
  box-shadow:0 0 25px rgba(212,175,55,.6);
}

.header span{
  font-size:16px;
  font-weight:700;
  letter-spacing:3px;
}

/* PANEL */
.panel{
  width:100%;
  max-width:420px;
  background:var(--blue-deep);
  border-radius:22px;
  padding:22px;
  border:5px double var(--gold);
  box-shadow:0 0 25px rgba(212,175,55,.3);
  position:relative;
}

.panel::before{
  content:"SPQR";
  position:absolute;
  top:-16px;
  left:50%;
  transform:translateX(-50%);
  background:var(--blue-dark);
  padding:4px 16px;
  border:3px solid var(--gold);
  border-radius:10px;
  letter-spacing:4px;
  font-size:12px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

/* CATALOGO */
.card-catalog{
  grid-column:1/-1;
  height:160px;
  border-radius:18px;
  cursor:pointer;
  background:
    linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.6)),
    url("https://tgwos.github.io/ROMABLANCA99/foto1.jpg")
    center/cover no-repeat;
  border:4px double var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-catalog span{
  font-size:22px;
  letter-spacing:6px;
}

/* SMALL CARDS */
.small-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  cursor:pointer;
}

.card-small{
  width:100%;
  height:110px;
  border-radius:16px;
  background:var(--marble);
  border:4px double var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-small img{
  width:90%;
  height:90%;
  object-fit:cover;
  border-radius:10px;
}

.small-label{
  padding:5px 12px;
  border-radius:10px;
  font-size:11px;
  letter-spacing:2px;
  background:var(--gold);
  color:#000;
}

/* POPUP */
.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.popup-overlay.show{display:flex;}

.popup-box{
  min-width:240px;
  padding:20px;
  border-radius:16px;
  background:var(--marble);
  border:4px double var(--gold);
  text-align:center;
  color:#000;
}

/* BOTTOM BAR */
.bottom-bar{
  position:fixed;
  bottom:12px;
  left:70px;
  right:70px;
  height:65px;
  background:var(--blue-deep);
  border-radius:20px;
  border:4px double var(--gold);
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 0 20px rgba(212,175,55,.4);
}

.bottom-bar svg{
  width:20px;
  height:20px;
  fill:var(--gold);
  stroke:var(--gold);
}
</style>
</head>

<body>

<div class="column left"></div>
<div class="column right"></div>

<div id="loader">
  <div id="loader-text">ROMA BLANCA 99</div>
</div>

<div class="container">

  <div class="header">
    <img src="https://tgwos.github.io/ROMABLANCA99/foto1.jpg">
    <span>CATALOGO ROMA BLANCA 99</span>
  </div>

  <div class="panel">
    <div class="grid">

      <div class="card-catalog" onclick="location.href='catalog.html'">
        <span>CATALOGO</span>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CONTACT',
             '📨 Telegram: @Italianfarm1',
             'https://t.me/Italianfarm1',
             '📞 Signal',
             'https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ROMABLANCA99/foto1.jpg">
        </div>
        <div class="small-label">CONTACTS</div>
      </div>

      <!-- resto invariato -->

    </div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
  },3000);
});
</script>

</body>
</html>
