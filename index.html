<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ROMA BLANCA 99</title>

<script src="https://telegram.org/js/telegram-web-app.js?v=6"></script>

<style>
:root{
  --gold-light:#f5e6b3;
  --gold:#d4af37;
  --gold-deep:#9c7c1a;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  font-family:"Cinzel", serif;
  color:var(--gold-deep);
  background:
    linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.95)),
    url("https://tgwos.github.io/ROMABLANCA99/sfondo.jpg")
    center/cover no-repeat fixed;
}

/* LOADER */
#loader{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ffffff;
}
#loader-text{
  position:absolute;
  bottom:14%;
  font-size:30px;
  letter-spacing:8px;
  color:var(--gold);
  text-shadow:2px 2px 4px rgba(0,0,0,.2);
}

/* BACKGROUND FIX */
.app-bg{display:none;}

/* LAYOUT */
.container{
  padding:28px 16px 130px;
  display:flex;
  flex-direction:column;
  gap:26px;
  align-items:center;
}

/* HEADER */
.header{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}
.header video{display:none;}
.header img{
  width:160px;
  height:160px;
  border-radius:18px;
  border:6px double var(--gold);
  object-fit:cover;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}
.header span{
  font-size:18px;
  font-weight:700;
  letter-spacing:3px;
}

/* PANEL */
.panel{
  width:100%;
  max-width:420px;
  background:linear-gradient(145deg,#ffffff,#ececec);
  border-radius:24px;
  padding:28px;
  border:6px double var(--gold);
  box-shadow:0 15px 35px rgba(0,0,0,.25);
  position:relative;
}
.panel::before{
  content:"SPQR";
  position:absolute;
  top:-18px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  padding:4px 18px;
  border:3px solid var(--gold);
  border-radius:12px;
  letter-spacing:4px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

/* CATALOGO */
.card-catalog{
  grid-column:1/-1;
  height:190px;
  border-radius:20px;
  cursor:pointer;
  background:
    linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.9)),
    url("https://tgwos.github.io/ROMABLANCA99/foto1.jpg")
    center/cover no-repeat;
  border:5px double var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
}
.card-catalog span{
  font-size:26px;
  letter-spacing:8px;
}

/* SMALL CARDS */
.small-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  cursor:pointer;
}
.card-small{
  width:100%;
  height:120px;
  border-radius:18px;
  background:#fff;
  border:5px double var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
}
.card-small img{
  width:90%;
  height:90%;
  object-fit:cover;
  border-radius:12px;
}
.small-label{
  padding:6px 14px;
  border-radius:12px;
  font-size:12px;
  letter-spacing:2px;
  background:var(--gold);
  color:#fff;
}

/* POPUP */
.popup-box{
  min-width:240px;
  padding:22px 26px;
  border-radius:18px;
  background:#fff;
  border:5px double var(--gold);
  text-align:center;
}
.popup-title{
  font-size:16px;
  letter-spacing:3px;
}
.popup-link{
  display:block;
  padding-top:10px;
  margin-top:10px;
  font-size:14px;
  color:var(--gold-deep);
  text-decoration:none;
}

/* BOTTOM BAR */
.bottom-bar{
  position:fixed;
  bottom:14px;
  left:14px;
  right:14px;
  height:70px;
  background:#fff;
  border-radius:24px;
  border:5px double var(--gold);
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
}
.bottom-bar svg{
  width:22px;
  height:22px;
  fill:var(--gold-deep);
  stroke:var(--gold-deep);
}
</style>
</head>

<body>

<div id="loader">
  <div id="loader-text">ROMA BLANCA 99</div>
</div>

<div class="container">

  <div class="header">
    <img id="logoStatic" src="https://tgwos.github.io/ROMABLANCA99/foto1.jpg">
    <span>CATALOGO ROMA BLANCA 99</span>
  </div>

  <div class="panel">
    <div class="grid">

      <div class="card-catalog" onclick="location.href='catalog.html'">
        <span>CATALOGO</span>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CONTACT',
             '📨 Telegram: @Italianfarm1',
             'https://t.me/Italianfarm1',
             '📞 Signal',
             'https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ROMABLANCA99/foto1.jpg">
        </div>
        <div class="small-label">CONTACTS</div>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CHANNEL',
             '📢 Telegram: GASCLOUDPRIVE',
             'https://t.me/+TIzcbA_vAMw4ZjU0'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ROMABLANCA99/foto1.jpg">
        </div>
        <div class="small-label">CHANNELS</div>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CREATED BY',
             '👨‍💻 BOX CREATE',
             'https://t.me/boxcreate22'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ROMABLANCA99/foto1.jpg">
        </div>
        <div class="small-label">CREATED BY</div>
      </div>

      <div class="small-wrapper">
        <div class="card-small">
          <img src="https://tgwos.github.io/ROMABLANCA99/foto1.jpg">
        </div>
        <div class="small-label">NEWS</div>
      </div>

    </div>
  </div>
</div>

<!-- POPUP -->
<div id="popup" class="popup-overlay" onclick="closePopup()">
  <div class="popup-box" onclick="event.stopPropagation()">
    <div class="popup-title" id="popup-title"></div>
    <a class="popup-link" id="popup-link-telegram" href="#"></a>
    <a class="popup-link" id="popup-link-signal" href="#" style="display:none;"></a>
  </div>
</div>

<div class="bottom-bar">
  <a onclick="tg.openLink('https://t.me/Italianfarm1')">
    <svg viewBox="0 0 24 24"><path d="M22.5 3.5L2.8 10.9c-.9.3-.9 1.6.1 1.9l4.9 1.6 1.9 5.9c.3.9 1.5 1 2 .2l2.8-4.1 5.6 4.1c.8.6 2 .1 2.2-.9l3.4-15.3c.2-.9-.7-1.6-1.7-1.4z"/></svg>
  </a>
  <a onclick="tg.openLink('https://instagram.com/INSERT_LINK')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" ry="5" fill="none" stroke-width="2"/>
    <circle cx="12" cy="12" r="4" fill="none" stroke-width="2"/>
    <circle cx="17.5" cy="6.5" r="1.2"/></svg>
  </a>
  <a onclick="tg.openLink('https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5')">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20"/></svg>
  </a>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
  },4000);
});

const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popup-title");
const popupTelegram = document.getElementById("popup-link-telegram");
const popupSignal = document.getElementById("popup-link-signal");

function openPopup(title, tgText, tgUrl, signalText, signalUrl){
  popupTitle.innerText = title;

  popupTelegram.innerText = tgText;
  popupTelegram.onclick = ()=>tg.openLink(tgUrl);
  popupTelegram.style.display = "block";

  if(signalText && signalUrl){
    popupSignal.innerText = signalText;
    popupSignal.onclick = ()=>tg.openLink(signalUrl);
    popupSignal.style.display = "block";
  } else {
    popupSignal.style.display = "none";
  }

  popup.classList.add("show");
}

function closePopup(){
  popup.classList.remove("show");
}
</script>

</body>
</html>
