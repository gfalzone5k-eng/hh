<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ITALIAN FARM</title>

<script src="https://telegram.org/js/telegram-web-app.js?v=6"></script>

<style>
:root{
  --green:#00ff88;
  --green-dark:#00c76a;
  --red:#ff2a2a;
  --red-dark:#a80000;
  --white:#ffffff;
  --bg1:#050505;
  --bg2:#0c0c0c;
  --glass:rgba(255,255,255,0.06);
  --blur:blur(18px);
}

/* RESET */
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--white);
  background:radial-gradient(circle at top, #111 0%, #000 60%);
  overflow-x:hidden;
}

/* BACKGROUND CINEMATICO */
.app-bg{
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.95)),
    url("https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg")
    center/cover no-repeat;
  filter:brightness(.5) contrast(1.2);
}

/* CONTAINER */
.container{
  padding:40px 20px 140px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:32px;
}

/* HEADER */
.header video,.header img{
  width:160px;
  height:160px;
  border-radius:30px;
  object-fit:cover;
  background:#000;
  box-shadow:
    0 20px 60px rgba(0,255,136,.25),
    0 10px 30px rgba(255,0,0,.2);
  transition:.4s;
}

.header video:hover,
.header img:hover{
  transform:scale(1.05);
}

.header span{
  font-size:18px;
  font-weight:800;
  letter-spacing:4px;
  background:linear-gradient(90deg,var(--green),var(--white),var(--red));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* PANEL GLASS */
.panel{
  width:100%;
  max-width:430px;
  padding:28px;
  border-radius:36px;
  background:var(--glass);
  backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:
    0 20px 60px rgba(0,0,0,.6),
    inset 0 0 40px rgba(0,255,136,.05);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

/* CATALOGO HERO */
.card-catalog{
  grid-column:1/-1;
  height:190px;
  border-radius:30px;
  cursor:pointer;
  background:
    linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.8)),
    url("https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg")
    center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  transition:.4s ease;
}

.card-catalog::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(0,255,136,.2),transparent);
  transform:translateX(-100%);
  transition:.6s;
}

.card-catalog:hover::before{
  transform:translateX(100%);
}

.card-catalog:hover{
  transform:translateY(-6px);
  box-shadow:
    0 25px 60px rgba(0,255,136,.25),
    0 10px 40px rgba(255,0,0,.2);
}

.card-catalog span{
  font-size:30px;
  font-weight:900;
  letter-spacing:8px;
  text-shadow:0 0 20px rgba(0,255,136,.4);
}

/* CARD SMALL */
.small-wrapper{
  display:flex;
  flex-direction:column;
  gap:10px;
  cursor:pointer;
  transition:.3s;
}

.card-small{
  height:120px;
  border-radius:24px;
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.3s;
  border:1px solid rgba(255,255,255,.06);
}

.card-small img{
  width:80%;
  height:80%;
  object-fit:contain;
  border-radius:16px;
}

.small-wrapper:hover{
  transform:translateY(-5px);
}

.small-wrapper:hover .card-small{
  box-shadow:
    0 20px 40px rgba(0,255,136,.15),
    0 10px 30px rgba(255,0,0,.15);
}

.small-label{
  font-size:12px;
  font-weight:800;
  letter-spacing:2px;
  text-align:center;
  opacity:.8;
}

/* POPUP PREMIUM */
.popup-box{
  padding:26px;
  border-radius:26px;
  background:rgba(20,20,20,.9);
  backdrop-filter:blur(20px);
  box-shadow:0 20px 60px rgba(0,0,0,.7);
  border:1px solid rgba(255,255,255,.08);
}

.popup-link{
  display:block;
  margin-top:12px;
  padding:12px;
  border-radius:14px;
  background:rgba(255,255,255,.05);
  transition:.3s;
}

.popup-link:hover{
  background:linear-gradient(135deg,var(--green-dark),var(--red-dark));
  color:#fff;
}

/* BOTTOM BAR LUXURY */
.bottom-bar{
  position:fixed;
  bottom:20px;
  left:20px;
  right:20px;
  height:70px;
  border-radius:30px;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(15px);
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 15px 40px rgba(0,0,0,.7);
  border:1px solid rgba(255,255,255,.06);
}

.bottom-bar svg{
  width:24px;
  height:24px;
  transition:.3s;
}

.bottom-bar a:hover svg{
  transform:scale(1.2);
  filter:drop-shadow(0 0 8px var(--green));
}
</style>
</head>

<body>

<div id="loader">
  <video autoplay muted playsinline>
    <source src="https://res.cloudinary.com/dizbl4jib/video/upload/v1771246950/IMG_4055_1_grhlla.mp4" type="video/mp4">
  </video>
  <div id="loader-text">ITALIAN FARM</div>
</div>

<div class="app-bg"></div>

<div class="container">

  <div class="header">
    <video id="logoVideo" autoplay muted playsinline>
      <source src="https://res.cloudinary.com/dizbl4jib/video/upload/v1771246950/IMG_4055_1_grhlla.mp4" type="video/mp4">
    </video>
    <img id="logoStatic" src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg" style="display:none">
    <span>CATALOGO ITALIAN FARM</span>
  </div>

  <!-- CORNICE GENERALE BOTTONI -->
  <div class="panel">
    <div class="grid">

      <div class="card-catalog" onclick="location.href='catalog.html'">
        <span>CATALOGO</span>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CONTACT',
             '📨 Telegram: @Italianfarm1',
             'https://t.me/Italianfarm1',
             '📞 Signal',
             'https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5',
             '🥔 POTATO',
             'https://tutuduanyu.org/italianfarm'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
        </div>
        <div class="small-label">CONTACTS</div>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CHANNEL',
             '📢 Telegram: ITALIAN FARM ',
             'https://t.me/+TIzcbA_vAMw4ZjU0',
             '📞 Signal',
             'https://signal.group/#CjQKIDNGRGl9UmFJzST3ADxn0PsPIc0zsRWW1foOy3Ity-KvEhBjRjUNbHUuV1qczApKp_ok'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
        </div>
        <div class="small-label">CHANNELS</div>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CREATED BY',
             '👨‍💻 BOX CREATE',
             'https://t.me/boxcreate22'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
        </div>
        <div class="small-label">CREATED BY</div>
      </div>

      <div class="small-wrapper" onclick="location.href='recensioni.html'">

  <div class="card-small">
    <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
  </div>

  <div class="small-label">RECENSIONI</div>

</div>

    </div>
  </div>
</div>

<!-- POPUP -->
<div id="popup" class="popup-overlay" onclick="closePopup()">
  <div class="popup-box" onclick="event.stopPropagation()">
    <div class="popup-title" id="popup-title"></div>
    <a class="popup-link" id="popup-link-telegram" href="#"></a>
    <a class="popup-link" id="popup-link-signal" href="#" style="display:none;"></a>
  </div>
</div>

<div class="bottom-bar">
  <a onclick="tg.openLink('https://t.me/Italianfarm1')">
    <svg viewBox="0 0 24 24"><path d="M22.5 3.5L2.8 10.9c-.9.3-.9 1.6.1 1.9l4.9 1.6 1.9 5.9c.3.9 1.5 1 2 .2l2.8-4.1 5.6 4.1c.8.6 2 .1 2.2-.9l3.4-15.3c.2-.9-.7-1.6-1.7-1.4z"/></svg>
  </a>
  <a onclick="tg.openLink('https://instagram.com/INSERT_LINK')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" ry="5" fill="none" stroke-width="2"/>
    <circle cx="12" cy="12" r="4" fill="none" stroke-width="2"/>
    <circle cx="17.5" cy="6.5" r="1.2"/></svg>
  </a>
  <a onclick="tg.openLink('https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5')">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20"/></svg>
  </a>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
  },4000);
});

const logoVideo = document.getElementById("logoVideo");
const logoStatic = document.getElementById("logoStatic");
logoVideo.addEventListener("ended",()=>{
  logoVideo.style.display="none";
  logoStatic.style.display="block";
});

const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popup-title");
const popupTelegram = document.getElementById("popup-link-telegram");
const popupSignal = document.getElementById("popup-link-signal");

function openPopup(title, tgText, tgUrl, signalText, signalUrl){
  popupTitle.innerText = title;

  popupTelegram.innerText = tgText;
  popupTelegram.onclick = ()=>tg.openLink(tgUrl);
  popupTelegram.style.display = "block";

  if(signalText && signalUrl){
    popupSignal.innerText = signalText;
    popupSignal.onclick = ()=>tg.openLink(signalUrl);
    popupSignal.style.display = "block";
  } else {
    popupSignal.style.display = "none";
  }

  popup.classList.add("show");
}

function closePopup(){
  popup.classList.remove("show");
}
</script>

</body>
</html>
