<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ITALIAN FARM</title>

<script src="https://telegram.org/js/telegram-web-app.js?v=6"></script>

<style>
<style>
:root{
  --gold-light:#f8e7a1;
  --gold:#d4af37;
  --gold-deep:#9c7c1a;
  --marble-bg:url("https://www.transparenttextures.com/patterns/white-marble.png");
}

/* RESET */
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:"Trajan Pro", "Cinzel", serif;
  color:var(--gold-deep);
  background:
    linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.95)),
    var(--marble-bg);
  background-size:cover;
  overflow-x:hidden;
}

/* ===== PARTICLE CANVAS ===== */
#goldParticles{
  position:fixed;
  inset:0;
  z-index:-1;
}

/* ===== LOADER ===== */
#loader{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f5f5;
}
#loader::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.85);
}
#loader-text{
  position:absolute;
  bottom:14%;
  font-size:36px;
  letter-spacing:8px;
  color:var(--gold);
  text-shadow:
    1px 1px 0 #fff,
    2px 2px 0 var(--gold-light),
    4px 4px 6px rgba(0,0,0,.25);
}

/* ===== HEADER ===== */
.header video,
.header img{
  width:170px;
  height:170px;
  border-radius:18px;
  object-fit:cover;
  border:4px solid var(--gold);
  box-shadow:
    inset 0 0 10px rgba(0,0,0,.4),
    0 6px 20px rgba(0,0,0,.25);
}

.header span{
  font-size:20px;
  letter-spacing:4px;
  color:var(--gold-deep);
  text-shadow:
    1px 1px 0 #fff,
    2px 2px 2px rgba(0,0,0,.2);
}

/* ===== PANEL ROMAN FRAME ===== */
.panel{
  width:100%;
  max-width:420px;
  padding:30px;
  border-radius:22px;
  background:
    linear-gradient(145deg,#ffffff,#eaeaea);
  border:6px double var(--gold);
  box-shadow:
    inset 0 0 15px rgba(0,0,0,.2),
    0 10px 30px rgba(0,0,0,.2);
  position:relative;
}

/* incisione romana decorativa */
.panel::before{
  content:"✠";
  position:absolute;
  top:-18px;
  left:50%;
  transform:translateX(-50%);
  font-size:28px;
  color:var(--gold);
  background:#fff;
  padding:4px 12px;
  border-radius:12px;
  border:2px solid var(--gold);
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
}

/* ===== CATALOGO PRINCIPALE ===== */
.card-catalog{
  grid-column:1/-1;
  height:190px;
  border-radius:18px;
  cursor:pointer;
  background:
    linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.9)),
    url("https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg")
    center/cover no-repeat;
  border:4px solid var(--gold);
  box-shadow:
    inset 0 0 15px rgba(0,0,0,.25),
    0 8px 25px rgba(0,0,0,.25);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.3s;
}

.card-catalog:hover{
  transform:translateY(-4px);
  box-shadow:
    inset 0 0 15px rgba(0,0,0,.3),
    0 12px 30px rgba(0,0,0,.3);
}

.card-catalog span{
  font-size:30px;
  letter-spacing:8px;
  color:var(--gold-deep);
  text-shadow:
    1px 1px 0 #fff,
    2px 2px 3px rgba(0,0,0,.3);
}

/* ===== SMALL CARDS ===== */
.card-small{
  height:120px;
  border-radius:16px;
  background:
    linear-gradient(145deg,#ffffff,#ececec);
  border:4px double var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 0 12px rgba(0,0,0,.2),
    0 6px 15px rgba(0,0,0,.2);
  transition:.3s;
}

.card-small:hover{
  transform:scale(1.04);
}

.card-small img{
  width:85%;
  height:85%;
  object-fit:contain;
}

.small-label{
  margin-top:6px;
  padding:6px 14px;
  border-radius:10px;
  font-size:12px;
  letter-spacing:2px;
  background:linear-gradient(145deg,var(--gold-light),var(--gold));
  color:#fff;
  box-shadow:
    inset 0 0 5px rgba(255,255,255,.4),
    0 3px 6px rgba(0,0,0,.2);
}

/* ===== POPUP ===== */
.popup-box{
  border-radius:18px;
  background:
    linear-gradient(145deg,#ffffff,#eaeaea);
  border:4px double var(--gold);
  box-shadow:
    inset 0 0 12px rgba(0,0,0,.2),
    0 10px 25px rgba(0,0,0,.25);
  padding:24px 28px;
}

.popup-title{
  font-size:18px;
  letter-spacing:4px;
  color:var(--gold-deep);
}

.popup-link{
  color:var(--gold-deep);
  text-decoration:none;
  font-weight:bold;
}

/* ===== BOTTOM BAR ===== */
.bottom-bar{
  position:fixed;
  bottom:14px;
  left:14px;
  right:14px;
  height:70px;
  background:
    linear-gradient(145deg,#ffffff,#eaeaea);
  border-radius:22px;
  border:4px double var(--gold);
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:
    inset 0 0 10px rgba(0,0,0,.2),
    0 6px 20px rgba(0,0,0,.25);
}

.bottom-bar svg{
  width:24px;
  height:24px;
  fill:var(--gold-deep);
  stroke:var(--gold-deep);
}
</style>
</head>

<body>

<div id="loader">
  <video autoplay muted playsinline>
    <source src="https://res.cloudinary.com/dizbl4jib/video/upload/v1771246950/IMG_4055_1_grhlla.mp4" type="video/mp4">
  </video>
  <div id="loader-text">ITALIAN FARM</div>
</div>

<div class="app-bg"></div>

<div class="container">

  <div class="header">
    <video id="logoVideo" autoplay muted playsinline>
      <source src="https://res.cloudinary.com/dizbl4jib/video/upload/v1771246950/IMG_4055_1_grhlla.mp4" type="video/mp4">
    </video>
    <img id="logoStatic" src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg" style="display:none">
    <span>CATALOGO ITALIAN FARM</span>
  </div>

  <!-- CORNICE GENERALE BOTTONI -->
  <div class="panel">
    <div class="grid">

      <div class="card-catalog" onclick="location.href='catalog.html'">
        <span>CATALOGO</span>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CONTACT',
             '📨 Telegram: @Italianfarm1',
             'https://t.me/Italianfarm1',
             '📞 Signal',
             'https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5',
             '🥔 POTATO',
             'https://tutuduanyu.org/italianfarm'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
        </div>
        <div class="small-label">CONTACTS</div>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CHANNEL',
             '📢 Telegram: GASCLOUDPRIVE',
             'https://t.me/+TIzcbA_vAMw4ZjU0',
             '📞 Signal',
             'https://signal.group/#CjQKIDNGRGl9UmFJzST3ADxn0PsPIc0zsRWW1foOy3Ity-KvEhBjRjUNbHUuV1qczApKp_ok'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
        </div>
        <div class="small-label">CHANNELS</div>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CREATED BY',
             '👨‍💻 BOX CREATE',
             'https://t.me/boxcreate22'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
        </div>
        <div class="small-label">CREATED BY</div>
      </div>

      <div class="small-wrapper">
        <div class="card-small">
          <img src="https://tgwos.github.io/ITALIANFARM/5807439531530194108.jpg">
        </div>
        <div class="small-label">NEWS</div>
      </div>

    </div>
  </div>
</div>

<!-- POPUP -->
<div id="popup" class="popup-overlay" onclick="closePopup()">
  <div class="popup-box" onclick="event.stopPropagation()">
    <div class="popup-title" id="popup-title"></div>
    <a class="popup-link" id="popup-link-telegram" href="#"></a>
    <a class="popup-link" id="popup-link-signal" href="#" style="display:none;"></a>
  </div>
</div>

<div class="bottom-bar">
  <a onclick="tg.openLink('https://t.me/Italianfarm1')">
    <svg viewBox="0 0 24 24"><path d="M22.5 3.5L2.8 10.9c-.9.3-.9 1.6.1 1.9l4.9 1.6 1.9 5.9c.3.9 1.5 1 2 .2l2.8-4.1 5.6 4.1c.8.6 2 .1 2.2-.9l3.4-15.3c.2-.9-.7-1.6-1.7-1.4z"/></svg>
  </a>
  <a onclick="tg.openLink('https://instagram.com/INSERT_LINK')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" ry="5" fill="none" stroke-width="2"/>
    <circle cx="12" cy="12" r="4" fill="none" stroke-width="2"/>
    <circle cx="17.5" cy="6.5" r="1.2"/></svg>
  </a>
  <a onclick="tg.openLink('https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5')">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20"/></svg>
  </a>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
  },4000);
});

const logoVideo = document.getElementById("logoVideo");
const logoStatic = document.getElementById("logoStatic");
logoVideo.addEventListener("ended",()=>{
  logoVideo.style.display="none";
  logoStatic.style.display="block";
});

const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popup-title");
const popupTelegram = document.getElementById("popup-link-telegram");
const popupSignal = document.getElementById("popup-link-signal");

function openPopup(title, tgText, tgUrl, signalText, signalUrl){
  popupTitle.innerText = title;

  popupTelegram.innerText = tgText;
  popupTelegram.onclick = ()=>tg.openLink(tgUrl);
  popupTelegram.style.display = "block";

  if(signalText && signalUrl){
    popupSignal.innerText = signalText;
    popupSignal.onclick = ()=>tg.openLink(signalUrl);
    popupSignal.style.display = "block";
  } else {
    popupSignal.style.display = "none";
  }

  popup.classList.add("show");
}

function closePopup(){
  popup.classList.remove("show");
}
</script>

</body>
</html>
