<style>
:root{

--bg:#0e0e11;
--card:#151518;
--border:#26262b;
--text:#ffffff;
--sub:#9b9ba1;

--accent:#ff3b30;

--radius:22px;

--blur:blur(20px);

--shadow:
0 10px 25px rgba(0,0,0,.45),
0 2px 6px rgba(0,0,0,.35);

}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html{
scroll-behavior:smooth;
}

body{

margin:0;
background:var(--bg);
color:var(--text);

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"Segoe UI",
Roboto,
sans-serif;

}

.container{

padding:20px 16px 140px;

display:flex;
flex-direction:column;
align-items:center;

gap:26px;

max-width:430px;
margin:auto;

}






/* HEADER LOGO */

.header-logo{

width:100%;
display:flex;
justify-content:center;
align-items:center;

padding-top:6px;

}

.header-logo img{

width:92px;
height:92px;

border-radius:50%;

object-fit:cover;

box-shadow:
0 6px 30px rgba(0,0,0,.6);

border:1px solid var(--border);

}







/* PREVIEW SLIDER */

.preview-box{

width:100%;
overflow:hidden;

}

.preview-slider{

display:flex;
gap:14px;

overflow-x:auto;
scroll-snap-type:x mandatory;

padding:4px 2px 10px;

}

.preview-slider::-webkit-scrollbar{
display:none;
}

.preview-card{

min-width:150px;
height:150px;

border-radius:20px;

overflow:hidden;

background:var(--card);

border:1px solid var(--border);

scroll-snap-align:start;

box-shadow:var(--shadow);

transition:.35s;

}

.preview-card:active{

transform:scale(.95);

}

.preview-card img{

width:100%;
height:100%;

object-fit:cover;

}







/* PANEL */

.panel{

width:100%;

background:rgba(21,21,24,.7);

backdrop-filter:var(--blur);

border-radius:var(--radius);

padding:20px;

border:1px solid var(--border);

box-shadow:var(--shadow);

}







/* GRID */

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:16px;

}







/* CARD CATALOGO */

.card-catalog{

grid-column:1/-1;

height:120px;

border-radius:var(--radius);

background:var(--card);

border:1px solid var(--border);

display:flex;
align-items:center;

gap:18px;

padding:0 22px;

cursor:pointer;

transition:.3s;

box-shadow:var(--shadow);

}

.card-catalog:active{
transform:scale(.97);
}

.card-catalog img{

width:70px;
height:70px;

border-radius:50%;

object-fit:cover;

}

.card-catalog span{

flex:1;

font-size:18px;

font-weight:700;

letter-spacing:.4px;

}







/* SMALL CARDS */

.card-small{

height:120px;

border-radius:var(--radius);

background:var(--card);

border:1px solid var(--border);

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

gap:10px;

cursor:pointer;

transition:.3s;

box-shadow:var(--shadow);

}

.card-small:active{
transform:scale(.95);
}

.card-small img{

width:52px;
height:52px;

border-radius:50%;

}

.card-small span{

font-size:12px;

font-weight:600;

color:var(--sub);

letter-spacing:.6px;

}







/* POPUP */

.popup-overlay{

position:fixed;
inset:0;

background:rgba(0,0,0,.55);

display:flex;
align-items:center;
justify-content:center;

opacity:0;
pointer-events:none;

transition:.25s;

}

.popup-overlay.show{

opacity:1;
pointer-events:auto;

}

.popup-box{

min-width:250px;

padding:24px;

border-radius:20px;

background:var(--card);

border:1px solid var(--border);

text-align:center;

box-shadow:var(--shadow);

}

.popup-title{

font-size:16px;
font-weight:700;

margin-bottom:12px;

}

.popup-username{

display:block;

padding:12px;

margin-top:8px;

border-radius:14px;

background:#1c1c20;

color:var(--text);

text-decoration:none;

font-size:14px;

font-weight:600;

}







/* BOTTOM BAR */

.bottom-bar{

position:fixed;

bottom:14px;
left:14px;
right:14px;

height:66px;

background:rgba(21,21,24,.85);

backdrop-filter:blur(20px);

border-radius:24px;

border:1px solid var(--border);

display:flex;

justify-content:space-around;
align-items:center;

box-shadow:var(--shadow);

}

.bottom-bar a{

display:flex;

align-items:center;

gap:6px;

font-size:12px;

font-weight:600;

color:var(--text);

text-decoration:none;

}

.bottom-bar svg{

width:22px;
height:22px;

fill:currentColor;

}







/* FLOAT BUTTON */

.createby-fab{

position:fixed;

right:18px;

width:60px;
height:60px;

border-radius:50%;

background:var(--card);

border:1px solid var(--border);

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

box-shadow:var(--shadow);

}

.createby-fab img{

width:42px;
height:42px;

border-radius:50%;

}






/* TOOLTIP */

.createby-tooltip{

position:absolute;

right:74px;
top:50%;

transform:translateY(-50%);

background:var(--card);

border:1px solid var(--border);

padding:10px 14px;

border-radius:14px;

font-size:11px;

font-weight:600;

white-space:nowrap;

}
  /* SECTION TITLE */

.preview-section{

width:100%;

}

.preview-title{

font-size:18px;

font-weight:700;

margin-bottom:8px;

padding-left:2px;

letter-spacing:.2px;

color:#fff;

}

/* SMOOTH IOS SCROLL */

.preview-slider{

scroll-behavior:smooth;

}

/* HOVER EFFECT */

.preview-card{

transition:
transform .35s cubic-bezier(.2,.8,.2,1),
box-shadow .35s;

}

.preview-card:hover{

transform:scale(1.05);

box-shadow:
0 12px 35px rgba(0,0,0,.6);

}
</style>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
  },4000);
});

const logoVideo = document.getElementById("logoVideo");
const logoStatic = document.getElementById("logoStatic");
logoVideo.addEventListener("ended",()=>{
  logoVideo.style.display="none";
  logoStatic.style.display="block";
});

const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popup-title");
const popupTelegram = document.getElementById("popup-link-telegram");
const popupSignal = document.getElementById("popup-link-signal");

function openPopup(title, tgText, tgUrl, signalText, signalUrl){
  popupTitle.innerText = title;

  popupTelegram.innerText = tgText;
  popupTelegram.onclick = ()=>tg.openLink(tgUrl);
  popupTelegram.style.display = "block";

  if(signalText && signalUrl){
    popupSignal.innerText = signalText;
    popupSignal.onclick = ()=>tg.openLink(signalUrl);
    popupSignal.style.display = "block";
  } else {
    popupSignal.style.display = "none";
  }

  popup.classList.add("show");
}

function closePopup(){
  popup.classList.remove("show");
}
</script>
<script>

let productsData = [];

async function loadProducts(){

const res = await fetch("products.json");
productsData = await res.json();

const slider = document.getElementById("preview-slider");

productsData.forEach(product => {

const card = document.createElement("div");
card.className = "preview-card";

card.innerHTML = `
<img src="${product.previewImage}">
`;

slider.appendChild(card);

});

duplicateSlider();
startSlider();

}

function duplicateSlider(){

const slider = document.getElementById("preview-slider");

const cards = [...slider.children];

cards.forEach(card=>{

const clone = card.cloneNode(true);

slider.appendChild(clone);

});

}

function startSlider(){

const slider = document.getElementById("preview-slider");

let speed = 0.35;

function animate(){

slider.scrollLeft += speed;

if(slider.scrollLeft >= slider.scrollWidth/2){

slider.scrollLeft = 0;

}

requestAnimationFrame(animate);

}

animate();

}

loadProducts();

</script>
