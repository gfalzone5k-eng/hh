:root{

--bg:#050505;
--card:#1b1b21;
--accent:#ff1a1a;
--accentSoft:#ff4d4d;

--text:#ffffff;
--sub:#9b9ba1;

--radius:22px;

}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{

margin:0;
color:var(--text);

font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;

background:var(--bg);

overflow-x:hidden;

}

/* SFONDO ANIMATO */

body::before{

content:"";

position:fixed;

inset:-50%;

background:

radial-gradient(circle at 20% 20%, rgba(255,0,0,0.25), transparent 40%),
radial-gradient(circle at 80% 30%, rgba(255,0,0,0.18), transparent 40%),
radial-gradient(circle at 50% 80%, rgba(255,0,0,0.15), transparent 50%);

filter:blur(120px);

animation:bgMove 18s linear infinite;

z-index:-2;

}

body::after{

content:"";

position:fixed;

inset:0;

background:url("https://grainy-gradients.vercel.app/noise.svg");

opacity:.05;

pointer-events:none;

z-index:-1;

}

@keyframes bgMove{

0%{
transform:translate(0,0);
}

50%{
transform:translate(-10%,5%);
}

100%{
transform:translate(0,0);
}

}

.container{

padding:24px 16px 140px;

display:flex;

flex-direction:column;

align-items:center;

gap:34px;

max-width:430px;

margin:auto;

}

/* LOGO */

.header-logo{
display:flex;
justify-content:center;
}

.header-logo img{

width:110px;
height:110px;

border-radius:50%;

object-fit:cover;

box-shadow:

0 0 30px rgba(255,0,0,.4),
0 0 60px rgba(255,0,0,.2);

}

/* ANIMAZIONE BORDO */

@keyframes ledBorder {

0%{
background-position:0% 50%;
}

100%{
background-position:300% 50%;
}

}

/* PREVIEW */

.preview-box{
width:100%;
overflow:hidden;
}

.preview-slider{

display:flex;

gap:16px;

overflow:hidden;

}

.preview-slider::-webkit-scrollbar{
display:none;
}

.preview-card{

min-width:150px;

height:160px;

border-radius:24px;

overflow:hidden;

border:1px solid rgba(255,0,0,.3);

background:var(--card);

box-shadow:
0 10px 25px rgba(0,0,0,.6);

pointer-events:none;

}

.preview-card img{
width:100%;
height:100%;
object-fit:cover;
}

/* PANEL */

.panel{

width:100%;

border-radius:var(--radius);

padding:20px;

background:var(--card);

border:1px solid rgba(255,0,0,.25);

box-shadow:
0 0 14px rgba(255,0,0,.2);

}

/* GRID */

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:18px;

}

/* CATALOGO */

.card-catalog{

grid-column:1/-1;

height:140px;

border-radius:var(--radius);

display:flex;

align-items:center;

gap:20px;

padding:0 22px;

cursor:pointer;

background:

linear-gradient(180deg,#1a1a1f,#0f0f12);

border:1px solid rgba(255,0,0,.35);

box-shadow:
0 0 20px rgba(255,0,0,.25);

transition:.25s;

}

.card-catalog:active{
transform:scale(.96);
}

.card-catalog img{
width:70px;
height:70px;
border-radius:50%;
}

.card-catalog span{

flex:1;

font-size:22px;

font-weight:700;

}

/* CARD PICCOLE */

.card-small{

height:120px;

border-radius:var(--radius);

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

gap:12px;

cursor:pointer;

background:var(--card);

border:1px solid rgba(255,0,0,.25);

box-shadow:
0 0 8px rgba(255,0,0,.25);

transition:.25s;

}

.card-small:active{
transform:scale(.92);
}

.card-small img{
width:52px;
height:52px;
border-radius:50%;
}

.card-small span{

font-size:12px;

color:var(--sub);

}

/* POPUP */

.popup-overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.65);

display:flex;

align-items:center;

justify-content:center;

opacity:0;

pointer-events:none;

transition:.25s;

}

.popup-overlay.show{
opacity:1;
pointer-events:auto;
}

.popup-box{

padding:26px;

border-radius:20px;

text-align:center;

background:var(--card);

border:1px solid rgba(255,0,0,.35);

box-shadow:
0 0 25px rgba(255,0,0,.3);

}

.popup-title{

font-size:16px;

font-weight:700;

margin-bottom:12px;

}

.popup-username{

display:block;

padding:12px;

margin-top:10px;

border-radius:14px;

background:#23232a;

color:white;

text-decoration:none;

transition:.2s;

}

.popup-username:active{
transform:scale(.96);
}

/* BOTTOM BAR */

.bottom-bar{

position:fixed;

bottom:14px;

left:14px;

right:14px;

height:72px;

display:flex;

justify-content:space-around;

align-items:center;

border-radius:26px;

backdrop-filter:blur(20px);

background:rgba(20,20,25,0.7);

border:1px solid rgba(255,0,0,.3);

box-shadow:
0 0 20px rgba(255,0,0,.25);

}

.bottom-bar a{

display:flex;

flex-direction:column;

align-items:center;

gap:4px;

font-size:12px;

font-weight:600;

color:var(--accent);

text-decoration:none;

transition:.2s;

}

.bottom-bar a:active{
transform:scale(.9);
}

/* FLOAT BUTTON */

.createby-fab{

position:fixed;

right:18px;

width:60px;
height:60px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

background:var(--card);

border:1px solid rgba(255,0,0,.35);

box-shadow:
0 0 20px rgba(255,0,0,.35);

}

.createby-fab img{
width:42px;
height:42px;
border-radius:50%;
}

.createby-tooltip{

position:absolute;

right:74px;

top:50%;

transform:translateY(-50%);

background:var(--card);

border:1px solid rgba(255,0,0,.3);

padding:10px 14px;

border-radius:14px;

font-size:11px;

white-space:nowrap;

}

<script>

const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popup-title");
const popupTelegram = document.getElementById("popup-link-telegram");
const popupSignal = document.getElementById("popup-link-signal");

function openPopup(title,tgText,tgUrl,signalText,signalUrl){

popupTitle.innerText = title;

popupTelegram.innerText = tgText;
popupTelegram.onclick = ()=>tg.openLink(tgUrl);
popupTelegram.style.display="block";

if(signalText && signalUrl){
popupSignal.innerText = signalText;
popupSignal.onclick = ()=>tg.openLink(signalUrl);
popupSignal.style.display="block";
}else{
popupSignal.style.display="none";
}

popup.classList.add("show");

}

function closePopup(){
popup.classList.remove("show");
}

</script>

<script>

let productsData = [];

async function loadProducts(){

const res = await fetch("products.json");
productsData = await res.json();

const slider = document.getElementById("preview-slider");

productsData.forEach(product => {

const card = document.createElement("div");
card.className = "preview-card";

card.innerHTML = `
<img src="${product.previewImage}">
`;

slider.appendChild(card);

});

duplicateSlider();
startSlider();

}

function duplicateSlider(){

const slider = document.getElementById("preview-slider");

const cards = [...slider.children];

cards.forEach(card=>{
const clone = card.cloneNode(true);
slider.appendChild(clone);
});

}

function startSlider(){

const slider = document.getElementById("preview-slider");

let speed = 0.35;

function animate(){

slider.scrollLeft += speed;

if(slider.scrollLeft >= slider.scrollWidth/2){
slider.scrollLeft = 0;
}

requestAnimationFrame(animate);

}

animate();

}

loadProducts();

</script>
